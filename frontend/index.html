<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GovService BD</title>
    <meta name="description" content="Bangladesh Government Services Portal with document management, checklists, Bengali/English support, and AI guidance." />
    <meta property="og:title" content="GovService BD" />
    <meta property="og:description" content="Bangladesh Government Services Portal with document management, checklists, Bengali/English support, and AI guidance." />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('govservice_theme');
          var theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          document.documentElement.setAttribute('data-bs-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute('data-bs-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
